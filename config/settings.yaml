zona_horaria: America/Santiago

rutas:
  raw: data/raw
  processed: data/processed
  validation: data/validation
  modelos: modelos
  xls_entrada: data/raw/xls

api_sip:
  base_url: https://sipub.api.coordinador.cl/sipub/api/v2
  # Según la documentación pública de la API SIP (v1.1, 2019). Confirmar con la vigente.
  endpoint_demanda: recursos/demanda_sistema_real
  param_fecha: fecha          # la API filtra por UN día; se consulta día a día
  limite_por_hora: 60         # límite por defecto del token
  campo_fecha: fecha
  campo_hora: hora
  campo_demanda: demanda
  convencion_hora: "1-24"   # "1-24" (hora que termina) o "0-23"
  timeout_s: 60

cen_historico:
  # Generación bruta horaria oficial, sin key. Publicado en coordinador.cl > Reportes y Estadísticas.
  # Cuando el Coordinador publique una versión nueva, actualiza esta URL.
  url: https://www.coordinador.cl/wp-content/uploads/2026/05/CEN-hist_gen_de_energia_por_hora_26.xlsx
  desde_anio: 2018          # SEN unificado desde nov-2017
  # Años que se leen pero NO se usan para entrenar ni evaluar.
  # 2025: en el archivo publicado (versión mayo 2026) el perfil horario viene desplazado
  # ~9 horas respecto de 2018-2024 (punta de madrugada). Ver reports/RESULTADOS.md.
  excluir_anios: [2025]

xls:
  # Ajustar al formato real del archivo descargado
  hoja: 0
  fila_encabezado: 0
  columna_fecha: Fecha
  formato: ancho            # "ancho" (horas como columnas) o "largo"
  columna_hora: Hora        # solo para formato largo
  columna_demanda: Demanda  # solo para formato largo
  convencion_hora: "1-24"
  decimal: ","

clima:
  # Open-Meteo: gratuito y sin API key. Ciudades ponderan la demanda nacional.
  ciudades:
    santiago:     {lat: -33.45, lon: -70.66, peso: 0.6}
    antofagasta:  {lat: -23.65, lon: -70.40, peso: 0.25}
    concepcion:   {lat: -36.83, lon: -73.05, peso: 0.15}
  base_calefaccion_c: 18
  base_enfriamiento_c: 24

validacion:
  tolerancia_pct: 0.5      # diferencia % aceptada por hora
  max_alertas: 0           # sobre este número el pipeline falla
  dias_rezago: 3           # compara días ya consolidados

modelo:
  horizonte_h: 24
  dias_test: 365          # se evalúa sobre el último año completo
  lightgbm:
    n_estimators: 600
    learning_rate: 0.05
    num_leaves: 63
