[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demanda"
version = "0.1.0"
description = "Pronóstico de demanda eléctrica del Sistema Eléctrico Nacional de Chile"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=14",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "requests>=2.31",
  "pyyaml>=6",
  "python-dotenv>=1.0",
  "holidays>=0.50",
  "lightgbm>=4.1",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "matplotlib>=3.8",
  "pytest>=8",
]

[project.optional-dependencies]
app = ["streamlit>=1.32", "plotly>=5.18"]
mlops = ["mlflow>=2.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
